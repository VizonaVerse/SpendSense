services:
  frontend:
    build: spendsense-react
    ports:
      - "5000:5000"
    depends_on:
      - backend
  backend:
    build:
      context: ./SpendSenseDjango
    ports:
      - "8000:8000"
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: adminpassword